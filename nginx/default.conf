
upstream home_upstream {
  server home:3000;
}
upstream cart_upstream {
  server cart:3000;
}

server {
  listen 80;
  server_name example.com;                      
  # Redirect all HTTP -> HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name example.com;                      

  # === TLS certs (replace with your cert files or use certbot/ACME) ===
  ssl_certificate      /etc/ssl/certs/fullchain.pem;
  ssl_certificate_key  /etc/ssl/private/privkey.pem;
  ssl_protocols        TLSv1.2 TLSv1.3;
  ssl_ciphers          HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # common proxy headers
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;

  # === CART (English) - rewrite /en/cart/... -> /cart/... and proxy to cart upstream ===
  location ^~ /en/cart/ {
    # Rewrite the incoming prefix /en/cart/ -> /cart/ for the upstream
    rewrite ^/en/cart/(.*)$ /cart/$1 break;

    proxy_pass http://cart_upstream;   # note: no path here - nginx appends rewritten URI
    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # exact /en/cart (no trailing slash) -> /cart
  location = /en/cart {
    proxy_pass http://cart_upstream/cart;  # upstream will see /cart
    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # === CART (Turkish) - rewrite /tr/cart/... -> /cart/... and proxy to cart upstream ===
  location ^~ /tr/cart/ {
    rewrite ^/tr/cart/(.*)$ /cart/$1 break;
    proxy_pass http://cart_upstream;
    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location = /tr/cart {
    proxy_pass http://cart_upstream/cart;
    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # === Serve cart's _next static files directly from cart upstream if requested under /cart/_next/ ===
  location ^~ /cart/_next/ {
    # pass to cart upstream
    rewrite ^/cart/(.*)$ /cart/$1 break;
    proxy_pass http://cart_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_cache_valid 200 1h;
  }

  # === Serve home _next static files from home upstream ===
  location ^~ /_next/ {
    proxy_pass http://home_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_cache_valid 200 1h;
  }

  # === API or other paths that belong to home app ===
  location / {
    proxy_pass http://home_upstream;
    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}
