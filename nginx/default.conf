upstream home_upstream {
  server home:3000;    # replace with your home service host:port
}

upstream cart_upstream {
  server cart:3000;    # replace with your cart service host:port
}

server {
  listen 80;
  server_name example.com;   # REPLACE with your domain (e.g. next-auth.vercel.app)
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name example.com;   # REPLACE

  # TLS certs - replace with your certs or use certbot
  ssl_certificate      /etc/ssl/certs/fullchain.pem;
  ssl_certificate_key  /etc/ssl/private/privkey.pem;
  ssl_protocols        TLSv1.2 TLSv1.3;
  ssl_ciphers          HIGH:!aNULL:!MD5;

  # Common proxy headers
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;

  # -------------------------
  # AUTH CALLBACKS / AUTH ROUTES
  # Make /auth/callback (Auth0 redirect) reach NextAuth's /api/auth/callback
  # -------------------------

  # Internally rewrite exact /auth/callback to /api/auth/callback, preserving querystring
  location = /auth/callback {
    rewrite ^/auth/callback$ /api/auth/callback break;
    proxy_pass http://home_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # Also rewrite any /auth/... routes to /api/auth/...
  # e.g. /auth/signin -> /api/auth/signin if you expect those.
  location ^~ /auth/ {
    rewrite ^/auth/(.*)$ /api/auth/$1 break;
    proxy_pass http://home_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # Ensure API auth endpoints are proxied too
  location ^~ /api/auth/ {
    proxy_pass http://home_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # -------------------------
  # CART LOCALE ROUTES -> cart upstream
  # e.g. /en/cart/...  ->  /cart/...
  # -------------------------
  location ^~ /en/cart/ {
    rewrite ^/en/cart/(.*)$ /cart/$1 break;
    proxy_pass http://cart_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }
  location = /en/cart {
    proxy_pass http://cart_upstream/cart;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location ^~ /tr/cart/ {
    rewrite ^/tr/cart/(.*)$ /cart/$1 break;
    proxy_pass http://cart_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }
  location = /tr/cart {
    proxy_pass http://cart_upstream/cart;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  # Serve cart's _next static via cart upstream if requested under /cart/_next/
  location ^~ /cart/_next/ {
    rewrite ^/cart/(.*)$ /cart/$1 break;
    proxy_pass http://cart_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_cache_valid 200 1h;
  }

  # Serve home _next static files
  location ^~ /_next/ {
    proxy_pass http://home_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_cache_valid 200 1h;
  }

  # Default route -> home app
  location / {
    proxy_pass http://home_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}
