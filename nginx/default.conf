server {
    listen 80;
    server_name next-auth-h9c5.vercel.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name next-auth-h9c5.vercel.app;

    ssl_certificate      /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key  /etc/ssl/private/privkey.pem;

    # Redirect /en/cart/* to the cart app on Vercel
    location /en/cart/ {
        proxy_pass https://next-auth-8sjz.vercel.app$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tr/cart/ {
        proxy_pass https://next-auth-8sjz.vercel.app$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else goes to home app
    location / {
        proxy_pass https://next-auth-h9c5.vercel.app$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
