# /etc/nginx/conf.d/default.conf
upstream home_upstream {
  server home:3000;   # change to your home service host:port (Docker service or localhost:3000)
}
upstream cart_upstream {
  server cart:3000;   # change to your cart service host:port
}

server {
  listen 80;
  server_name next-auth.vercel.app;
  # Redirect all HTTP to HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name next-auth.vercel.app; 

  # TLS certs (replace these paths with your certificate files)
  ssl_certificate      /etc/ssl/certs/fullchain.pem;
  ssl_certificate_key  /etc/ssl/private/privkey.pem;
  ssl_protocols        TLSv1.2 TLSv1.3;
  ssl_ciphers          HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # Common proxy headers (do NOT append :8080 to $host)
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;

  # ------------------------------------------------------------
  # AUTH: map external /auth/* -> internal /api/auth/* (NextAuth expects /api/auth)
  # This ensures Auth0 redirects (e.g. /auth/callback?code=...) reach NextAuth.
  # ------------------------------------------------------------
  location = /auth/callback {
    rewrite ^/auth/callback$ /api/auth/callback break;
    proxy_pass http://home_upstream;     # home app handles NextAuth at /api/auth
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location ^~ /auth/ {
    rewrite ^/auth/(.*)$ /api/auth/$1 break;
    proxy_pass http://home_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location ^~ /api/auth/ {
    proxy_pass http://home_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  # ------------------------------------------------------------
  # CART locale routes: rewrite /en/cart/... and /tr/cart/... -> /cart/... for the cart upstream
  # Important: cart app must be built with basePath: "/cart" so assets and links work.
  # ------------------------------------------------------------
  location ^~ /en/cart/ {
    rewrite ^/en/cart/(.*)$ /cart/$1 break;
    proxy_pass http://cart_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location = /en/cart {
    proxy_pass http://cart_upstream/cart;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location ^~ /tr/cart/ {
    rewrite ^/tr/cart/(.*)$ /cart/$1 break;
    proxy_pass http://cart_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location = /tr/cart {
    proxy_pass http://cart_upstream/cart;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  # Serve cart's /cart/_next static assets from cart upstream
  location ^~ /cart/_next/ {
    rewrite ^/cart/(.*)$ /cart/$1 break;
    proxy_pass http://cart_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_cache_valid 200 1h;
  }

  # Serve home _next & static files from home upstream
  location ^~ /_next/ {
    proxy_pass http://home_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_cache_valid 200 1h;
  }

  # Default: everything else goes to home app
  location / {
    proxy_pass http://home_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}
