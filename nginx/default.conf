
server {
  listen 80;
  server_name localhost;

  # Use ^~ so this prefix match wins and nginx does not test regex locations.
  location ^~ /en/cart/ {
    proxy_pass http://cart:3000/en/cart/;
    proxy_redirect off;

    # standard proxy headers
    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Forwarded-Host    $host:8080;
    proxy_set_header X-Forwarded-Port    $server_port;

    # HTTP/1.1 and connection settings (recommended)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 90s;
  }

  # exact /en/cart (no trailing slash)
  location = /en/cart {
    proxy_pass http://cart:3000/en/cart;
    proxy_redirect off;

    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Forwarded-Host    $host:8080;
    proxy_set_header X-Forwarded-Port    $server_port;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 90s;
  }

  # === CART (Turkish) - handles /tr/cart and /tr/cart/... ===
  location ^~ /tr/cart/ {
    proxy_pass http://cart:3000/tr/cart/;
    proxy_redirect off;

    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Forwarded-Host    $host:8080;
    proxy_set_header X-Forwarded-Port    $server_port;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 90s;
  }

  location = /tr/cart {
    proxy_pass http://cart:3000/tr/cart;
    proxy_redirect off;

    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Forwarded-Host    $host:8080;
    proxy_set_header X-Forwarded-Port    $server_port;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 90s;
  }

  # === Next.js static assets for home service (default) ===
  location ^~ /_next/static/ {
    proxy_pass http://home:3000/_next/static/;
    proxy_redirect off;

    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Forwarded-Host    $host:8080;
    proxy_set_header X-Forwarded-Port    $server_port;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 90s;
  }

  # === Everything else => home app ===
  location / {
    proxy_pass http://home:3000/;
    proxy_redirect off;

    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Forwarded-Host    $host:8080;
    proxy_set_header X-Forwarded-Port    $server_port;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 90s;
  }
}
