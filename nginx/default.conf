# /etc/nginx/conf.d/default.conf

server {
  listen 80;
  server_name next-auth-h9c5.vercel.app;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name next-auth-h9c5.vercel.app;

  ssl_certificate      /etc/ssl/certs/fullchain.pem;
  ssl_certificate_key  /etc/ssl/private/privkey.pem;
  ssl_protocols        TLSv1.2 TLSv1.3;
  ssl_ciphers          HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Redirect /en/cart and /tr/cart to the cart application
  location ^~ /en/cart/ {
    rewrite ^/en/cart/(.*)$ /cart/$1 break;
    proxy_pass https://next-auth-8sjz.vercel.app;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location ^~ /tr/cart/ {
    rewrite ^/tr/cart/(.*)$ /cart/$1 break;
    proxy_pass https://next-auth-8sjz.vercel.app;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  # Serve static assets for the cart application
  location ^~ /cart/_next/ {
    proxy_pass https://next-auth-8sjz.vercel.app/cart/_next/;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_cache_valid 200 1h;
  }

  # Default: all other traffic → home app
  location / {
    proxy_pass https://next-auth-h9c5.vercel.app;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}
